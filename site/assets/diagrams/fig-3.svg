  <title id="fig-3-title">A merge grows the date cohort from 4 to 21</title>
  <desc id="fig-3-desc">
    All commits shown share one UTC date. The selected chain advances from m4,
    whose date cohort has four commits, to merge M. M keeps m4 as its first
    parent and reaches sixteen additional feature commits through its second
    parent. Including M itself gives N of 21. Values 5 through 20 are
    unassigned, so reverse lookup for them returns not found.
  </desc>
