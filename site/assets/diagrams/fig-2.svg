  <title id="fig-2-title">The incident topology, scored two ways</title>
  <desc id="fig-2-desc">
    A shared commit graph where four main-branch commits are merged into a
    feature branch and the merge is fast-forwarded back onto main. Panel A shows
    0.2’s first-parent-only count dropping from 4 to 3. Panel B shows 0.3’s
    date-cohort count rising from 4 to 7 on the exact same graph, because every
    commit stays reachable.
  </desc>
