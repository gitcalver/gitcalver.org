  <title id="fig-4-title">
    Whether a shallow clone can prove a target’s cohort
  </title>
  <desc id="fig-4-desc">
    Two matched shallow-history cases show target T, same-date commit A1,
    boundary B, and unavailable parent history beyond a shallow cut. Top: B is
    older than T, so the walk prunes at B before unavailable history matters and
    exit code 0 is permitted. Bottom: B shares T's date and counts, but its
    parents are unavailable; hidden same-date commits may exist, so exit code 4
    is required.
  </desc>
