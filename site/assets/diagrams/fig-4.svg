  <title id="fig-4-title">
    Whether a shallow clone can prove a target’s cohort
  </title>
  <desc id="fig-4-desc">
    Top: every path from the target reaches either a same-date commit that keeps
    being explored, or a boundary strictly older than the target, so the count
    is provable. Bottom: a boundary that shares the target’s date leaves open
    whether hidden history beyond it shares the date too, so the implementation
    must refuse with the incomplete-history result.
  </desc>
