  <title id="fig-1-title">A merge that jumps N from 4 to 21 in one step</title>
  <desc id="fig-1-desc">
    Four main-branch commits carrying N 1 through 4 are followed by a merge that
    brings in sixteen same-day feature commits plus the merge commit itself, so
    N jumps to 21. Versions 5 through 20 for that date were never assigned to
    any commit, and reverse lookup for any of them must report that the version
    was not found.
  </desc>
