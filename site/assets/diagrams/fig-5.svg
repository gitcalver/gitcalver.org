  <title id="fig-5-title">
    Publication continuity under the reparenting topology
  </title>
  <desc id="fig-5-desc">
    The same graph as Figure 2: the previous canonical tag’s target C4 is no
    longer the publishing commit M’s first-parent ancestor, but it is still
    reachable through M’s second parent with an unchanged date, so step 5
    passes. A reachable target with a later date than the publishing commit
    still fails the check.
  </desc>
