>
  <title id="fig-5-title">
    Publication continuity checks reachability and date
  </title>
  <desc id="fig-5-desc">
    An older common ancestor O forks into the main and feature histories. The
    publishing commit M reaches the previous canonical tag target C4 through its
    second parent, and C4 has the same date as M. Both step 5 conditions pass,
    so publication may continue to later checks. In the contrast, M reaches D1
    but D1 is later-dated than M, so the date condition fails and step 5 blocks
    publication.
  </desc>
