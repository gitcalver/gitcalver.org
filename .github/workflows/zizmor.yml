name: Zizmor
on:
  push:
    branches:
      - "**"
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          persona: pedantic
          # We don't have GitHub Advanced Security, so skip the SARIF upload to
          # the security tab and surface findings as inline annotations instead.
          advanced-security: false
          annotations: true
