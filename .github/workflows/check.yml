name: Check
on:
  push:
    branches:
      - "**"
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: make actions-lock-install
        env:
          GH_TOKEN: ${{ github.token }}
      - run: make check-toolchain
      - run: make check-pins
      # Prettier comes from package-lock.json; Ruff and ty come from uv.lock.
      # This is the same `make lint` the pre-commit hook runs locally.
      - run: make lint
      # Byte-compares the committed figure SVGs with a clean, offline
      # regeneration from their gitgraph.js scene definitions (no browser).
      - run: make check-diagrams

  fonts:
    name: Fonts
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      # Builds the site (catching template errors), byte-compares a clean
      # regeneration, and proves font and favicon tampering is detected.
      - run: make check-fonts
      - run: make check-html
      - run: make check-css

  worker:
    name: Worker
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: make check-worker check-metadata

  accessibility:
    name: Accessibility
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # The Playwright package and its Chromium build are both selected by the
      # package lock; --with-deps supplies the runner's native browser libraries.
      - run: node_modules/.bin/playwright install --with-deps chromium
      # Covers every rendered page type (including the 404) at 320px and
      # desktop widths in both color modes, then exercises copy outcomes, TOCs,
      # scrollspy, keyboard-accessible overflow, and the UTC date rollover.
      - run: make check-accessibility check-interactions

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Builds the site and audits it with the package-lock-pinned Lighthouse CI
      # and the runner’s Google Chrome; see lighthouserc.cjs for page coverage.
      - run: make lighthouse
